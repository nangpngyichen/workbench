<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#FF8FB8">
  <title>我的小工作台 💕</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="assets/icons/app-icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app"></div>
  <script src="app.js"></script>
  <script>
    // 注册 Service Worker（支持离线 / 添加到主屏幕，长期在手机使用）
    if ('serviceWorker' in navigator) {
      // 新版本 SW 接管后自动刷新，确保拿到最新 app.js（解决 iOS「添加到主屏幕」后卡旧版的惰性更新）
      navigator.serviceWorker.addEventListener('controllerchange', function () {
        location.reload();
      });
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').catch(function () {});
      });
      // ?fresh=1：注销旧 SW + 清空所有缓存，强制拉取最新代码（手机卡旧版时的自救入口）
      if (location.search.indexOf('fresh=1') >= 0) {
        navigator.serviceWorker.getRegistrations().then(function (regs) {
          return Promise.all(regs.map(function (r) { return r.unregister(); }));
        }).then(function () {
          if (window.caches) return caches.keys().then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k); })); });
        }).then(function () { location.reload(true); });
      }
    }
  </script>
</body>
</html>
